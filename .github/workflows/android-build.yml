name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # 4. Android SDK
      - name: Install Android SDK
        run: |
          mkdir -p /opt/android-sdk/cmdline-tools

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O /tmp/cmdline-tools.zip

          unzip -q /tmp/cmdline-tools.zip \
            -d /opt/android-sdk/cmdline-tools/

          mv /opt/android-sdk/cmdline-tools/cmdline-tools \
            /opt/android-sdk/cmdline-tools/latest

          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV

          echo "/opt/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/opt/android-sdk/platform-tools" >> $GITHUB_PATH

      # 5. SDK components
      - name: Accept SDK licenses and install components
        run: |
          yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

          /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;37.0.0" || true

      # 6. Install npm dependencies
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # 7. Generate Android project
      - name: Generate Android native code
        env:
          CI: 1
        run: npx expo prebuild --platform android --non-interactive

      # 8. Configure Gradle permissions
      - name: Gradle wrapper permission
        run: chmod +x android/gradlew

      # 9. Android SDK location
      - name: Set Android SDK location
        run: echo "sdk.dir=/opt/android-sdk" > android/local.properties

      # 10. Configure Gradle caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # 11. Build APK
      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease \
            --build-cache \
            --parallel \
            --max-workers=4

      # 12. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cleani-city-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error
