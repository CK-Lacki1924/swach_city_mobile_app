name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, android, linux]
    timeout-minutes: 60

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install npm dependencies (Node 24 is pre-installed in the runner image)
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # 3. Generate Android native code
      - name: Generate Android native code
        env:
          CI: 1
          ANDROID_HOME: /opt/android-sdk
          ANDROID_SDK_ROOT: /opt/android-sdk
        run: npx expo prebuild --platform android --non-interactive

      # 4. Configure Gradle permissions
      - name: Gradle wrapper permission
        run: chmod +x android/gradlew

      # 5. Android SDK location
      - name: Set Android SDK location
        run: echo "sdk.dir=/opt/android-sdk" > android/local.properties

      # 6. Configure Gradle caching (Gradle daemon can persist across runs on self-hosted)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # 7. Build APK
      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease \
            --build-cache \
            --configure-on-demand \
            --max-workers=2

      # 8. Upload APK artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cleani-city-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error
